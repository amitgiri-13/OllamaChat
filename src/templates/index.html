<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ollama Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --sidebar: #111111;
  --surface: #1f1f1f;
  --border: #2a2a2a;
  --text: #ececec;
  --text-muted: #aaaaaa;
  --user-bg: #1a7f64;
  --user-text: #ffffff;
  --accent: #10a37f;
  --radius: 18px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  line-height: 1.6;
}

/* ── Layout ─────────────────────────────── */
.app {
  display: flex;
  height: 100vh;
}

/* ── Sidebar ─────────────────────────────── */
.sidebar {
  width: 280px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  z-index: 100;
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
  }
}

.sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.8px;
  flex: 1;
}

.logo span {
  color: var(--accent);
}

.btn-new {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-new:hover {
  background: #0e8c6d;
  transform: scale(1.05);
}

.model-select-wrap {
  padding: 12px 20px;
}

.model-select-wrap label {
  font-size: 12px;
  color: var(--text-muted);
  display: block;
  margin-bottom: 6px;
}

.model-select {
  width: 100%;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
}

.history-label {
  padding: 12px 20px 6px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: all 0.2s;
}

.chat-item:hover {
  background: rgba(255,255,255,0.08);
}

.chat-item.active {
  background: rgba(16, 163, 127, 0.15);
  color: var(--accent);
}

.chat-item-title {
  font-size: 14.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

/* ── Main Area ─────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  z-index: 10;
}

.topbar-title {
  font-size: 16px;
  font-weight: 500;
  flex: 1;
  text-align: center;
  margin-left: -30px;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
}

.icon-btn:hover {
  background: rgba(255,255,255,0.1);
}

/* ── Messages ─────────────────────────────── */
.messages-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 32px 0;
}

.messages-inner {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 24px;
}

.message {
  display: flex;
  gap: 14px;
  margin-bottom: 32px;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  margin-top: 4px;
}

.avatar.user {
  background: var(--user-bg);
  color: white;
  font-size: 15px;
}

.avatar.ai {
  background: #1f1f1f;
  border: 1px solid #333;
  font-size: 18px;
}

.msg-content {
  font-size: 15.8px;
  line-height: 1.75;
  max-width: 100%;
}

.msg-content.user-content {
  background: var(--user-bg);
  color: var(--user-text);
  border-radius: 20px 20px 4px 20px;
  padding: 14px 18px;
  display: inline-block;
  border-bottom-right-radius: 4px;
}

.msg-content pre {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 16px;
  overflow-x: auto;
  margin: 12px 0;
}

.msg-content code {
  font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
  background: #2a2a2a;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 14px;
}

/* ── Input Area ─────────────────────────────── */
.input-area {
  padding: 16px 24px 28px;
  background: var(--bg);
}

.input-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 12px 16px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: all 0.25s;
}

.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(16, 163, 127, 0.15);
}

textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  resize: none;
  font-family: inherit;
  font-size: 16px;
  max-height: 200px;
  line-height: 1.65;
  color: var(--text);
}

.send-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.send-btn:hover:not(:disabled) {
  background: #0e8c6d;
  transform: scale(1.08);
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #555;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f1f1f;
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
  z-index: 1000;
}

.toast.show {
  opacity: 1;
  visibility: visible;
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">Olla<span>ma</span></span>
      <button class="btn-new" id="btn-new" title="New chat">✦</button>
    </div>

    <div class="model-select-wrap">
      <label>Model</label>
      <select class="model-select" id="model-select">
        <option value="llama3">llama3</option>
      </select>
    </div>

    <div class="history-label">Conversations</div>
    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-footer">Powered by Ollama · Local AI</div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn hamburger" id="hamburger" title="Toggle sidebar">☰</button>
      <div class="topbar-title" id="topbar-title">New chat</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-clear-chat" title="Clear current chat">🗑</button>
        <button class="icon-btn" id="btn-export" title="Export chat">↓</button>
      </div>
    </div>

    <div class="messages-wrap" id="messages-wrap">
      <div class="messages-inner" id="messages-inner">
        <div class="empty-state" id="empty-state">
          <div class="empty-logo">✦</div>
          <h2>What can I help you with?</h2>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-area-inner">
        <div class="input-box">
          <textarea id="prompt" placeholder="Message Ollama…" rows="1"></textarea>
          <button class="send-btn" id="send-btn" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div class="input-hint">Enter to send · Shift+Enter for new line</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Storage helpers ──────────────────────────────────────────────────
const STORAGE_KEY = 'ollama_chats_v2';

function loadAllChats() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function saveAllChats(chats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function genId() {
  return 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

// ── State ────────────────────────────────────────────────────────────
let allChats = loadAllChats();      // { [id]: { id, title, model, messages, createdAt } }
let activeChatId = null;
let isStreaming = false;
let abortController = null;

// ── DOM refs ─────────────────────────────────────────────────────────
const chatList      = document.getElementById('chat-list');
const messagesInner = document.getElementById('messages-inner');
const emptyState    = document.getElementById('empty-state');
const promptEl      = document.getElementById('prompt');
const sendBtn       = document.getElementById('send-btn');
const modelSelect   = document.getElementById('model-select');
const topbarTitle   = document.getElementById('topbar-title');
const toast         = document.getElementById('toast');
const sidebar       = document.getElementById('sidebar');

// ── Models ───────────────────────────────────────────────────────────
async function loadModels() {
  try {
    const r = await fetch('/models');
    const d = await r.json();
    modelSelect.innerHTML = '';
    d.models.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      modelSelect.appendChild(o);
    });
  } catch {}
}

// ── Sidebar render ───────────────────────────────────────────────────
function renderSidebar() {
  chatList.innerHTML = '';
  const sorted = Object.values(allChats).sort((a, b) => b.createdAt - a.createdAt);
  if (sorted.length === 0) {
    chatList.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--muted)">No conversations yet</div>';
    return;
  }
  sorted.forEach(chat => {
    const el = document.createElement('div');
    el.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');
    el.dataset.id = chat.id;
    el.innerHTML = `
      <span class="chat-item-icon">💬</span>
      <span class="chat-item-title">${escHtml(chat.title)}</span>
      <button class="chat-item-del" title="Delete" onclick="deleteChat('${chat.id}', event)">✕</button>
    `;
    el.addEventListener('click', () => switchChat(chat.id));
    chatList.appendChild(el);
  });
}

// ── Chat management ──────────────────────────────────────────────────
function newChat() {
  const id = genId();
  allChats[id] = {
    id,
    title: 'New chat',
    model: modelSelect.value || 'llama3',
    messages: [],
    createdAt: Date.now()
  };
  saveAllChats(allChats);
  switchChat(id);
}

function switchChat(id) {
  activeChatId = id;
  renderSidebar();
  renderMessages();
  topbarTitle.textContent = allChats[id]?.title || 'New chat';
  // Set model
  if (allChats[id]?.model && modelSelect) {
    modelSelect.value = allChats[id].model;
  }
  closeSidebarMobile();
}

function deleteChat(id, e) {
  e.stopPropagation();
  delete allChats[id];
  saveAllChats(allChats);
  if (activeChatId === id) {
    activeChatId = null;
    renderMessages();
    topbarTitle.textContent = 'New chat';
  }
  renderSidebar();
}

function deleteAllChats() {
  if (!confirm('Delete all conversations?')) return;
  allChats = {};
  activeChatId = null;
  saveAllChats(allChats);
  renderSidebar();
  renderMessages();
  topbarTitle.textContent = 'New chat';
}

// ── Messages render ──────────────────────────────────────────────────
function renderMessages() {
  const messages = activeChatId ? (allChats[activeChatId]?.messages || []) : [];

  if (messages.length === 0) {
    messagesInner.innerHTML = '';
    const clone = emptyState.cloneNode(true);
    clone.style.display = 'flex';
    messagesInner.appendChild(clone);
    return;
  }

  messagesInner.innerHTML = '';
  messages.forEach((msg, i) => appendMessageEl(msg.role, msg.content, false));
  scrollToBottom();
}

function appendMessageEl(role, content, streaming = false) {
  // Remove empty state if present
  const es = messagesInner.querySelector('.empty-state');
  if (es) es.remove();

  const wrap = document.createElement('div');
  wrap.className = 'message';
  wrap.dataset.role = role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
  avatar.textContent = role === 'user' ? 'U' : '✦';

  const body = document.createElement('div');
  body.className = 'msg-body';

  const roleLabel = document.createElement('div');
  roleLabel.className = 'msg-role ' + (role === 'user' ? 'user' : 'ai');
  roleLabel.textContent = role === 'user' ? 'You' : 'Ollama';

  const contentEl = document.createElement('div');
  contentEl.className = 'msg-content' + (role === 'user' ? ' user-content' : '');

  if (streaming) {
    contentEl.innerHTML = '<span class="cursor"></span>';
  } else {
    contentEl.innerHTML = role === 'user' ? escHtml(content) : renderMarkdown(content);
  }

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML = `<button class="msg-action-btn" onclick="copyText(this)">Copy</button>`;

  body.appendChild(roleLabel);
  body.appendChild(contentEl);
  if (role === 'ai') body.appendChild(actions);

  wrap.appendChild(avatar);
  wrap.appendChild(body);
  messagesInner.appendChild(wrap);
  scrollToBottom();

  return contentEl;
}

function scrollToBottom() {
  const wrap = document.getElementById('messages-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

// ── Send message ─────────────────────────────────────────────────────
async function sendMessage() {
  const prompt = promptEl.value.trim();
  if (!prompt || isStreaming) return;

  // Create chat if none
  if (!activeChatId) {
    newChat();
  }

  const chat = allChats[activeChatId];
  chat.model = modelSelect.value;

  // User message
  chat.messages.push({ role: 'user', content: prompt });
  if (chat.title === 'New chat') {
    chat.title = prompt.slice(0, 42) + (prompt.length > 42 ? '…' : '');
    topbarTitle.textContent = chat.title;
  }
  saveAllChats(allChats);
  renderSidebar();

  appendMessageEl('user', prompt, false);
  promptEl.value = '';
  autoResize();

  // AI message placeholder
  const aiContentEl = appendMessageEl('ai', '', true);

  // Stream
  isStreaming = true;
  abortController = new AbortController();
  setSendBtn(true);

  const formData = new FormData();
  formData.append('prompt', prompt);
  formData.append('model', chat.model);
  // Send full history (excluding the message we just added) for context
  const historyToSend = chat.messages.slice(0, -1); // exclude last (current user msg)
  formData.append('history', JSON.stringify(historyToSend));

  let aiText = '';

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      body: formData,
      signal: abortController.signal
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          aiText += data.token;
          aiContentEl.innerHTML = renderMarkdown(aiText) + (data.done ? '' : '<span class="cursor"></span>');
          scrollToBottom();
          if (data.done) break;
        } catch {}
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      aiText += '\n[Connection error]';
    }
  }

  // Finalise
  aiContentEl.innerHTML = renderMarkdown(aiText || '[No response]');
  chat.messages.push({ role: 'ai', content: aiText || '[No response]' });
  saveAllChats(allChats);

  isStreaming = false;
  abortController = null;
  setSendBtn(false);
  scrollToBottom();
}

function stopStreaming() {
  if (abortController) abortController.abort();
}

function setSendBtn(streaming) {
  sendBtn.disabled = false;
  if (streaming) {
    sendBtn.classList.add('stop-btn');
    sendBtn.title = 'Stop';
    sendBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`;
    sendBtn.onclick = stopStreaming;
  } else {
    sendBtn.classList.remove('stop-btn');
    sendBtn.title = 'Send';
    sendBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;
    sendBtn.onclick = sendMessage;
  }
}

// ── Markdown renderer (lightweight) ─────────────────────────────────
function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);

  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="lang-${lang}">${code.trim()}</code></pre>`
  );

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists
  html = html.replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');

  // Numbered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Paragraphs — double newline
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';

  // Clean up empty paragraphs
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<h[123]>)/g, '$1');
  html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');

  return html;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Utilities ────────────────────────────────────────────────────────
function fillPrompt(text) {
  promptEl.value = text;
  promptEl.focus();
  autoResize();
}

function copyText(btn) {
  const msgBody = btn.closest('.msg-body');
  const content = msgBody.querySelector('.msg-content').innerText;
  navigator.clipboard.writeText(content).then(() => showToast('Copied!'));
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function autoResize() {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + 'px';
}

function exportChat() {
  if (!activeChatId) return;
  const chat = allChats[activeChatId];
  const text = chat.messages.map(m => `[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n---\n\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = chat.title.replace(/[^a-z0-9]/gi, '_') + '.txt';
  a.click();
}

function closeSidebarMobile() {
  if (window.innerWidth <= 640) sidebar.classList.remove('open');
}

// ── Events ───────────────────────────────────────────────────────────
promptEl.addEventListener('input', autoResize);

promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    isStreaming ? stopStreaming() : sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

document.getElementById('btn-new').addEventListener('click', newChat);

document.getElementById('btn-clear-chat').addEventListener('click', () => {
  if (!activeChatId) return;
  if (!confirm('Clear this conversation?')) return;
  allChats[activeChatId].messages = [];
  allChats[activeChatId].title = 'New chat';
  saveAllChats(allChats);
  renderMessages();
  renderSidebar();
  topbarTitle.textContent = 'New chat';
});

document.getElementById('btn-export').addEventListener('click', exportChat);

document.getElementById('hamburger').addEventListener('click', () => {
  sidebar.classList.toggle('open');
});

modelSelect.addEventListener('change', () => {
  if (activeChatId) {
    allChats[activeChatId].model = modelSelect.value;
    saveAllChats(allChats);
  }
});

// ── Init ─────────────────────────────────────────────────────────────
loadModels();
renderSidebar();
renderMessages();

// Start fresh with a new chat ready to go
// (don't auto-create, let user start)
</script>
</body>
